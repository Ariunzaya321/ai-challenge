<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8"><title>AI Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0f1226;--card:#1b1f3d;--ink:#f3f4ff;--mut:#9aa0d0;--acc:#ffd23f;--pri:#6c5ce7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:12px}
.wrap{max-width:900px;margin:auto}.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
h1,h2{margin:.2em 0}h1{font-size:clamp(22px,6vw,30px)}h2{font-size:clamp(17px,4.5vw,22px)}button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer;margin:3px}
button.g{background:#2d325e}button.y{background:var(--acc);color:#222;font-weight:700}button:disabled{opacity:.4}
input,textarea{width:100%;background:#0f1226;color:var(--ink);border:1px solid #3a3f78;border-radius:10px;padding:10px;font:inherit;margin:4px 0}
.timer{font-size:clamp(40px,13vw,60px);font-weight:800;text-align:center;color:var(--acc)}.c{text-align:center}
.stage{position:relative;text-align:center}.stage img{max-width:100%;max-height:50vh;border-radius:14px;border:3px solid var(--acc)}
.chars{display:flex;justify-content:center;gap:20px;font-size:44px;margin-top:8px}.chars span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.chars span:nth-child(2){animation-delay:.4s}.talk span{animation:talk .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}@keyframes talk{50%{transform:translateY(-14px) rotate(8deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.t{background:#0f1226;border-radius:10px;padding:8px;text-align:center;font-size:14px}.t.ok{outline:2px solid #2ecc71}
.rate button{font-size:22px;min-width:52px}.rate button.sel{background:var(--acc);color:#222}
.rrow{display:flex;align-items:center;gap:12px;background:#0f1226;border-radius:12px;padding:10px 14px;margin:8px 0;animation:pop .5s;text-align:left}
.rrow .pos{font-size:13px;color:var(--mut);min-width:54px}.rrow .ch{font-size:26px}.rrow .nm{flex:1;font-size:16px;font-weight:600}.rrow .sc{font-size:16px;color:var(--acc);font-weight:700}
.win{background:linear-gradient(135deg,#3b2f8f,#6c5ce7);border:2px solid var(--acc);border-radius:18px;padding:18px;margin:14px 0;animation:pop .8s}
.win .ch{font-size:56px}.win .t1{font-size:18px;font-weight:800;color:var(--acc)}.win .msg{font-size:15px;line-height:1.6;margin-top:10px}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}.big{font-size:19px;font-weight:700}
.mut{color:var(--mut)}.fly{position:fixed;font-size:32px;z-index:9;pointer-events:none}
#fs{display:none;position:fixed;inset:0;background:#000;z-index:50;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}#fs img{width:100vw;height:calc(100vh - 70px);object-fit:contain}#fs .bar{color:#fff;font-size:22px;padding:10px;text-align:center}.stage img{cursor:zoom-in}
#qr{display:inline-block;background:#fff;padding:8px;border-radius:8px}
</style></head><body><div id="fs" onclick="A.fs(false)"></div><div class="wrap" id="app"><div class="card c">Ачаалж байна…</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,getDoc,getDocs,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ЭНД FIREBASE ТОХИРГООГОО ХУУЛЖ ТАВИНА ====== */
const firebaseConfig={apiKey:"AIzaSyDEqRhKv2xJb0QF12IAJCi8T0pBo5tsNdk",authDomain:"ai-challenge-3c5bb.firebaseapp.com",projectId:"ai-challenge-3c5bb",appId:"1:1044313472349:web:5e33e1f8f5adc9340bbcb4"};
/* ==================================================== */

const TEAMS=["bi_hen_be","elon_musk","shudarga_yos","analog_irgen","toyota_mgmt","amidral_3","genom_code","singapur_nuuts"];
const NAMES=["Би хэн бэ","Элон Маск","Шударга ёс","Аналог иргэн ирсэн нь","Тоёота менежмент","Амьдрал 3.0","Геномын код тайлагч","Сингапурын хөгжлийн нууц"];
const DOM='@challenge.app',EM=['👾','🤖','👩‍🚀','🦄','🐲','🦊','🐼','🐙','🐱','🦁','🐸','🧙','🥷','🦸','🧛','👽'];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const D=p=>doc(db,...p.split('/')),C=p=>collection(db,p);
let chosen={},taken={},me=null,S={phase:'lobby'},T={},V={},R=null,myVotes={},first=true,revTimer=null,cfDone=false,subs=false;
const CH=n=>chosen[n]||'❔',$=id=>document.getElementById(id),tn=n=>NAMES[n-1]||('Team '+n);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const myTeam=()=>me&&!me.owner?(TEAMS.indexOf(me.name)+1)||null:null;

onAuthStateChanged(auth,u=>{
 if(!u){me=null;render();return}
 const name=u.email.split('@')[0];me={uid:u.uid,name,owner:name==='admin'};
 if(!subs){subs=true;
  onSnapshot(D('game/state'),s=>{S=s.exists()?s.data():{phase:'lobby'};if(me.owner&&S.phase==='results'&&(S.revealStep||0)<8)runReveal();render()});
  onSnapshot(C('teams'),s=>{T={};s.forEach(d=>T[d.id]=d.data());render()});
  onSnapshot(C('voted'),s=>{V={};s.forEach(d=>V[d.id]=1);
   if(!first&&S.phase==='present')s.docChanges().forEach(c=>{if(c.type==='added')fly(c.doc.id)});first=false;render()});
  onSnapshot(C('chars'),s=>{chosen={};taken={};s.forEach(d=>{const t=+d.data().team;taken[d.id]=t;chosen[t]=EM[+d.id]});render()});
  onSnapshot(D('game/results'),s=>{R=s.exists()?s.data():null;render()});
  setInterval(()=>{if(S.phase==='work')render();else if(S.phase==='present'){const e=$('tm');if(e)e.textContent='⏱ '+tmText();if(me.owner)autoStep()}},1000)}
 render()});

async function login(){const u=$('u').value.trim().toLowerCase().split('@')[0],p=$('p').value;
 try{await signInWithEmailAndPassword(auth,u+DOM,p)}catch(e){$('err').textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'||e.code==='auth/invalid-email')?'Нэр эсвэл нууц үг буруу ('+e.code+')':'Алдаа: '+(e.code||e.message)}}
const setS=p=>setDoc(D('game/state'),{...S,...p});
function fly(id){const a=document.querySelector('.chars span'),b=document.querySelector('.stage img');if(!a||!b)return;
 const x=a.getBoundingClientRect(),y=b.getBoundingClientRect(),e=document.createElement('div');e.className='fly';e.textContent='⭐';
 e.style.left=x.left+'px';e.style.top=x.top+'px';document.body.appendChild(e);
 e.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${y.left+y.width/2-x.left}px,${y.top+y.height/2-x.top}px) scale(2) rotate(360deg)`}],{duration:900,easing:'ease-in'}).onfinish=()=>{e.textContent='✨';setTimeout(()=>e.remove(),500)}}
const left=()=>Math.max(0,Math.round((S.deadline-Date.now())/1000));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const voters=()=>Object.keys(V).filter(k=>k.startsWith(S.cur+'_')).length;

function screen(){
 if(S.phase==='lobby')return `<div class="card c"><h2>⏳ Challenge эхлэхийг хүлээж байна</h2><div class="grid">${[0,1,2,3,4,5,6,7].map(i=>`<div class="t ${chosen[i+1]?'ok':''}">${CH(i+1)}<br>${tn(i+1)}</div>`).join('')}</div></div>`;
 if(S.phase==='work')return `<div class="card"><div class="c mut">Challenge</div><h2 class="c">${esc(S.challenge)}</h2><div class="timer">⏱ ${fmt(left())}</div>
  <div class="grid">${[0,1,2,3,4,5,6,7].map(i=>`<div class="t ${T['t'+(i+1)]?.submitted?'ok':''}">${CH(i+1)} ${tn(i+1)}<br>${T['t'+(i+1)]?.submitted?'✅ илгээсэн':'бүтээж байна'}</div>`).join('')}</div></div>`;
 if(S.phase==='present'){const t=T['t'+S.cur]||{};
  return `<div class="card stage"><div class="big">${tn(S.cur)}</div><p class="mut">${esc(S.challenge)}</p>${t.img?`<img src="${t.img}" onclick="A.fs(true)">`:'<p>(зураг алга)</p>'}
  <div class="chars ${S.voting?'':'talk'}"><span>${CH(S.cur)}</span><span>${CH(S.cur)}</span></div><div class="mut">AI: ${esc(t.ai)}</div>
  <h2>${S.voting?'⭐ VOTING OPEN':S.closed?'✅ Voting хаагдлаа':'🎤 Танилцуулж байна'}</h2>${S.closed?'':`<div class="timer" id="tm">⏱ ${tmText()}</div>`}
  ${S.voting?`<div class="big">${voters()} / 7 TEAMS VOTED</div><div class="grid">${[0,1,2,3,4,5,6,7].map(i=>i+1===S.cur?'':`<div class="t ${V[S.cur+'_'+(i+1)]?'ok':''}">${CH(i+1)} ${tn(i+1)} ${V[S.cur+'_'+(i+1)]?'✓':''}</div>`).join('')}</div>`:''}</div>`}
if(S.phase==='results'&&R){const k=Math.min(S.revealStep||0,R.rank.length);const shown=R.rank.slice(R.rank.length-k).reverse();
  const rows=shown.map(r=>{const pos=R.rank.indexOf(r)+1;
   if(pos===1)return `<div class="win"><div class="ch">${CH(r.t)}</div><div class="t1">🏆 1-р байр · ${tn(r.t)} · ${r.avg.toFixed(2)}</div><div class="msg">${tn(r.t)} ${CH(r.t)} та 12р долоо хоногийн Инженерийн ёс зүй хичээлийн эргэлтийн цэг багийн ажилбар дээр ялагч болж эргэлтийн цэг багаас 2% үнэлгээ авлаа</div></div>`;
   return `<div class="rrow"><span class="pos">${pos}-р байр</span><span class="ch">${CH(r.t)}</span><span class="nm">${tn(r.t)}</span><span class="sc">${r.avg.toFixed(2)}</span></div>`}).join('');
  return `<div class="card c"><h1>🏆 FINAL RESULTS</h1>${k===0?'<p class="mut">Үр дүнг хүлээж байна…</p>':''}${rows}</div>`}
 return '<div class="card c">…</div>'}

function admin(){
 const b=(l,f,c='')=>`<button class="${c}" onclick="${f}">${l}</button>`;
 let h=`<div class="card"><h2>👨‍🏫 Админ</h2>`;
 if(S.phase==='lobby')h+=`<input id="ch" value="2050 оны Монголын сургууль">${b('START CHALLENGE','A.startC()','y')}<p class="mut">Хүүхдүүд QR уншуулж орно:</p><div id="qr"></div>`;
 if(S.phase==='work')h+=`<p>Илгээсэн: ${Object.values(T).filter(t=>t.submitted).length}/8</p>${b('Presentation эхлүүлэх (хугацаа дуусаагүй бол эрт хаана)','A.startP()','y')}`;
 if(S.phase==='present')h+=`<p>Одоо: ${tn(S.cur)} · <span class="mut">танилцуулга ${PRES}с, voting ${VOTE}с (автоматаар)</span></p>${b('🖼️ Зургийг дэлгэц дүүрэн','A.fs(true)','g')}${S.voting?b('Voting эрт хаах','A.closeVote()','y'):S.closed?(S.cur<8?b('Дараагийн баг → '+tn(S.cur+1),'A.nextT()','y'):b('🏆 REVEAL RESULTS','A.reveal()','y')):b('Танилцуулгыг дуусгаж voting нээх','A.openVote()','y')}`;
 if(S.phase==='results')h+=b('Шинээр эхлэх (reset)','A.reset()','g');
 return h+'</div>'}

function leader(){const n=myTeam();
 if(!n)return '<div class="card">Энэ хэрэглэгч ямар ч багтай холбогдоогүй байна.</div>';
 const t=T['t'+n]||{};let h=`<div class="card"><h2>Тавтай морил, ${tn(n)} ${CH(n)}</h2>`;
 if(!chosen[n]&&(S.phase==='lobby'||S.phase==='work'))h+=`<p class="big">Багийнхаа дүрийг сонгоно уу</p><p class="mut">Нэг дүрийг зөвхөн нэг баг сонгоно. Сонгосноо өөрчилж болохгүй.</p><div class="grid">${EM.map((e,i)=>`<button class="g" ${taken[i]!==undefined?'disabled':''} style="font-size:34px" onclick="A.pickChar(${i})">${e}</button>`).join('')}</div>`;
 if(S.phase==='lobby')h+='<p>Challenge эхлэхийг хүлээнэ үү…</p>';
 if(S.phase==='work'){if(t.submitted)h+=`<div class="big">✅ ${tn(n)} багийн бүтээл хүлээн авлаа!</div>`;
  else if(left()===0)h+='<p>Хугацаа дууссан.</p>';
  else h+=`<input id="ai" placeholder="Ямар AI ашигласан бэ?"><textarea id="pr" rows="4" placeholder="Prompt"></textarea><input type="file" id="im" accept="image/*"><button class="y" onclick="A.submitF()">SUBMIT FINAL</button><p class="mut">Илгээсний дараа өөрчилж болохгүй.</p>`}
 if(S.phase==='present'){if(S.cur===n)h+='<p>Таны багийн танилцуулга. Өөртөө санал өгөхгүй.</p>';
  else if(!S.voting)h+=S.closed?'<p>Voting хаагдсан.</p>':'<p>Танилцуулгыг сонсоно уу…</p>';
  else if(V[S.cur+'_'+n])h+='<div class="big">✓ Санал өгсөн</div>';
  else h+=`<p>«${tn(S.cur)}» багийн зургийг үнэл:</p><div class="rate">${[1,2,3,4,5].map(k=>`<button class="${myVotes[S.cur]===k?'sel':''}" onclick="A.pick(${k})">${k}</button>`).join('')}</div><button class="y" ${myVotes[S.cur]?'':'disabled'} onclick="A.vote()">⭐ VOTE</button>`}
 return h+'</div>'}

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});

const PRES=60,VOTE=20;
const sl=t=>t?Math.max(0,Math.round((t-Date.now())/1000)):0;
const tmText=()=>S.voting?sl(S.vEnd)+'с':fmt(sl(S.pEnd));
const openVote=()=>setS({voting:true,closed:false,vEnd:Date.now()+VOTE*1000});
const closeVote=()=>setS({voting:false,closed:true});
let stepBusy=false;
async function autoStep(){if(stepBusy||S.phase!=='present')return;const now=Date.now();
 try{if(!S.voting&&!S.closed&&S.pEnd&&now>=S.pEnd){stepBusy=true;await openVote()}
 else if(S.voting&&S.vEnd&&now>=S.vEnd){stepBusy=true;await closeVote()}}finally{stepBusy=false}}
function runReveal(){if(revTimer||!me||!me.owner)return;revTimer=setInterval(async()=>{
 if(S.phase!=='results'){clearInterval(revTimer);revTimer=null;return}
 const k=S.revealStep||0;if(k>=8){clearInterval(revTimer);revTimer=null;return}
 await setS({revealStep:k+1})},2800)}
function confetti(){const c=['#ffd23f','#6c5ce7','#2ecc71','#ff6b6b','#4dabf7'];for(let i=0;i<70;i++){const e=document.createElement('div');e.className='cf';
 e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDuration=(2.5+Math.random()*2.5)+'s';e.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}}
let fsOn=false;
function updFS(){const e=$('fs');if(!e)return;if(fsOn&&S.phase==='present'&&T['t'+S.cur]?.img){e.style.display='flex';
  e.innerHTML=`<img src="${T['t'+S.cur].img}"><div class="bar">${tn(S.cur)} ${CH(S.cur)}${S.voting?' · ⭐ VOTING OPEN · '+voters()+' / 7':''} <span style="opacity:.5">(хаахын тулд дарна)</span></div>`}
 else{e.style.display='none';if(S.phase!=='present')fsOn=false}}
window.A={setS,
 async pickChar(i){const n=myTeam();if(chosen[n])return;try{await setDoc(D('chars/'+i),{team:String(n)})}catch(e){alert('Энэ дүрийг өөр баг аль хэдийн сонгосон байна. Өөрийг сонгоно уу.')}},fs(on){if(on&&!(S.phase==='present'&&T['t'+S.cur]?.img))return alert('Одоогоор харуулах зураг алга (Presentation эхлээгүй эсвэл тус баг зураг илгээгээгүй).');fsOn=on;if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen();updFS()},
 pick(k){myVotes[S.cur]=k;render()},
 startC(){return setS({phase:'work',challenge:$('ch').value,deadline:Date.now()+7*60000})},
 startP(){return setS({phase:'present',cur:1,voting:false,closed:false,pEnd:Date.now()+PRES*1000,vEnd:null})},
 openVote,closeVote,
 nextT(){return S.cur<8?setS({cur:S.cur+1,voting:false,closed:false,pEnd:Date.now()+PRES*1000,vEnd:null}):null},
 async submitF(){const n=myTeam(),f=$('im').files[0],ai=$('ai').value.trim(),pr=$('pr').value.trim();
  if(!f||!ai||!pr)return alert('AI, prompt, зураг гурвуулаа шаардлагатай');
  if(!confirm('Эцсийн илгээлт. Дараа нь өөрчилж болохгүй.'))return;
  await setDoc(D('teams/t'+n),{ai,prompt:pr,img:await shrink(f),submitted:true})},
 async vote(){const n=myTeam(),k=myVotes[S.cur];
  try{await setDoc(D('votes/'+me.uid),{from:n,v:{['t'+S.cur]:k}},{merge:true});await setDoc(D('voted/'+S.cur+'_'+n),{t:Date.now()})}catch(e){alert('Санал өгч чадсангүй: '+(e.code||e.message))}},
 async reveal(){const sum={},cnt={};(await getDocs(C('votes'))).forEach(d=>{const x=d.data();for(const k in x.v){if('t'+x.from===k)continue;sum[k]=(sum[k]||0)+x.v[k];cnt[k]=(cnt[k]||0)+1}});
  const rank=[1,2,3,4,5,6,7,8].map(t=>({t,avg:cnt['t'+t]?sum['t'+t]/cnt['t'+t]:0})).sort((a,b)=>b.avg-a.avg);
  await setDoc(D('game/results'),{rank});cfDone=false;await setS({phase:'results',revealStep:0});runReveal()},
 async reset(){if(!confirm('Бүх өгөгдлийг цэвэрлэх үү?'))return;
  for(const c of ['teams','voted','votes','chars'])for(const d of (await getDocs(C(c))).docs)await deleteDoc(d.ref);
  await deleteDoc(D('game/results'));cfDone=false;await setS({phase:'lobby',revealStep:0})},
 login,out:()=>signOut(auth)};

function render(){
 const a=document.activeElement;if(me&&a&&['ai','pr','ch','im'].includes(a.id))return;
 if(!me){$('app').innerHTML=`<div class="card c"><h1>🎮 AI CHALLENGE</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="y" onclick="A.login()">LOGIN</button><div id="err" class="mut"></div></div>`;return}
 $('app').innerHTML=`<h1 class="c">🎮 AI CHALLENGE</h1>${screen()}${me.owner?admin():leader()}<div class="c"><button class="g" onclick="A.out()">Гарах (${me.name})</button><div class="mut" style="font-size:12px">хувилбар v9 · fullscreen</div></div>`;
 if(me.owner&&S.phase==='lobby'&&$('qr')&&!$('qr').firstChild)new QRCode($('qr'),{text:location.href,width:180,height:180});updFS();if(S.phase!=='results')cfDone=false;else if(R&&(S.revealStep||0)>=R.rank.length&&!cfDone){cfDone=true;confetti()}}
</script></body></html>
